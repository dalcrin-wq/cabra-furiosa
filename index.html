:root{
  --bg:#10151f; --p1:#172031; --p2:#1e2940; --p3:#26334d; --line:#2b3850;
  --txt:#eef2f7; --mut:#8e9bb0; --dim:#5d6a80;
  --vis:#f6a723; --vis2:#ff7f3a; --silver:#c7d0db; --ember:#ff5a1f; --ember2:#ff8a3d;
  --ok:#34d17a; --mid:#f59e0b; --low:#e3c24a; --bad:#ef4444;
  --tf:#f6a723; --tr:#4cc3ff; --tm:#ff5a1f; --to:#6b7a92;
  --disp:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --r1:4px; --r2:10px; --r3:18px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none;background:var(--bg);overflow-x:hidden;max-width:100%}
body{overflow-x:hidden;overflow-x:clip;max-width:100%;touch-action:pan-y pinch-zoom}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;touch-action:manipulation;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
input,textarea,select{font-size:max(16px,1em)}
button,.chip,.cell,.day,.tabs,#tabs{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--vis);outline-offset:2px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ── Cabecera ── */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 18px 6px}
.brand{font-family:var(--disp);font-weight:900;font-size:26px;line-height:1;letter-spacing:.02em}
.brand b{color:var(--vis);font-weight:900}
.today-lbl{text-align:right;font-size:13px;color:var(--mut);line-height:1.25}
.today-lbl strong{display:block;color:var(--txt);font-weight:700;font-size:15px}
.wake{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle;box-shadow:0 0 6px var(--ok)}
.wake.off{background:var(--ember);box-shadow:0 0 6px var(--ember)}

/* ── Cinta reflectante: el elemento firma ── */
.tape{position:relative;height:12px;border-radius:2px;overflow:hidden;
  background:linear-gradient(180deg,var(--vis) 0 32%,var(--silver) 32% 68%,var(--vis) 68% 100%)}
.tape::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 48%,transparent 62%);
  transform:translateX(-120%)}
.tape.shine::after{animation:shine 1.4s .2s cubic-bezier(.3,.7,.3,1) both}
@keyframes shine{to{transform:translateX(120%)}}
.tape.thin{height:6px}
.track{height:12px;border-radius:2px;background:var(--p2);overflow:hidden}
.track .tape{height:100%;border-radius:0}

main{padding:4px 14px 20px;max-width:640px;margin:0 auto;overflow-x:clip}
main.enter{animation:enter .28s cubic-bezier(.25,.8,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateX(var(--dx,18px))}to{opacity:1;transform:none}}

/* ── Superficies (jerarquía = radio distinto) ── */
.panel{background:var(--p1);border-radius:var(--r3);padding:16px;margin-bottom:12px}
.row-list>.lrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.row-list>.lrow:last-child{border-bottom:0}
h2{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:.01em;margin-bottom:10px}
h3{font-size:15px;font-weight:700;margin-bottom:6px}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:12px}
p+p{margin-top:8px}

/* ── Botones ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 16px;
  border-radius:var(--r2);background:linear-gradient(100deg,#f8b53a 0%,var(--vis) 50%,var(--vis2) 100%);color:#1a1206;font-weight:700;font-size:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px -6px rgba(255,127,58,.45);transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.ember{background:var(--ember);color:#fff;box-shadow:none}
.btn.ghost{background:var(--p2);color:var(--txt);box-shadow:none}
.btn.line{background:transparent;color:var(--txt);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 12px;border-radius:999px;background:var(--p2);font-size:14px;font-weight:600;color:var(--txt)}
.chip.on{background:var(--vis);color:#141414}
.chip.x{padding-right:6px}
.chip .del{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.25);font-size:12px}
.link{color:var(--vis);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ── HOY: el dorsal ── */
.hero{position:relative;background:var(--p1);border-radius:6px 26px 6px 26px;padding:18px 18px 16px;margin-bottom:12px;overflow:hidden}
.hero.done{background:linear-gradient(160deg,#143324,var(--p1) 60%)}
.hero-top{display:flex;gap:16px;align-items:flex-start}
.jersey{font-family:var(--disp);font-weight:900;font-size:128px;line-height:.78;color:var(--vis);min-width:84px;text-align:center;
  text-shadow:0 6px 0 rgba(0,0,0,.25)}
.jersey.t-r{color:var(--tr)} .jersey.t-m{color:var(--tm)} .jersey.t-o{color:var(--to)}
.hero.done .jersey{color:var(--ok)}
.hero h1{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1.02;margin:2px 0 6px}
.hero .meta{font-size:14px;color:var(--mut)}
.hero .mains{font-size:14px;color:var(--silver);margin-top:10px;line-height:1.5}
.hero .tape{margin:16px -18px 14px}
.load .jersey{animation:rise .7s .05s cubic-bezier(.2,1.2,.4,1) both}
.load .hero h1,.load .hero .meta{animation:fade .5s .25s both}
.load .hero .tape{animation:sweep .7s .15s cubic-bezier(.6,0,.2,1) both}
@keyframes rise{from{transform:translateY(40px) scale(.8);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.stamp{display:inline-flex;align-items:center;gap:6px;background:var(--ok);color:#06210f;font-weight:700;font-size:14px;padding:4px 10px;border-radius:4px;margin-bottom:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--p3);color:var(--silver)}
.tag.g{background:#3a2a05;color:var(--vis);box-shadow:inset 0 0 0 1px #6e5a0a}
.tag.x{background:#0b2d3d;color:var(--tr)}
.tag.warn{background:#3d1a08;color:var(--ember2)}

/* semáforo */
.sema{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.sema button{padding:10px 4px;border-radius:var(--r2);background:var(--p2);font-size:13.5px;font-weight:600;line-height:1.25;color:var(--mut)}
.sema button i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 6px}
.sema button.on{color:var(--txt);box-shadow:inset 0 0 0 2px currentColor}
.sema .g i{background:var(--ok)} .sema .y i{background:var(--mid)} .sema .r i{background:var(--low)}
.sema .g.on{color:var(--ok)} .sema .y.on{color:var(--mid)} .sema .r.on{color:var(--low)}

/* marcador */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:12px}
.board>div{background:var(--p1);padding:12px 8px;text-align:center}
.board .v{font-family:var(--disp);font-weight:900;font-size:34px;line-height:1}
.board .l{font-size:12.5px;color:var(--mut);margin-top:4px}

/* coach */
.coach{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r2);background:var(--p1);margin-bottom:12px;border-left:4px solid var(--vis);font-size:15px}
.coach.alert{border-left-color:var(--ember);background:linear-gradient(90deg,#2a1710,var(--p1) 60%)}

/* mapa de constancia: 8 semanas × 7 días */
.cmap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:auto;align-items:start;gap:4px;max-width:266px;margin:0 auto}
.cmap .hd{font-size:11px;color:var(--dim);text-align:center;font-weight:700}
.cell{position:relative;min-width:0;width:100%;padding:0;aspect-ratio:1;height:auto;align-self:start;overflow:hidden;line-height:1;border-radius:4px;background:var(--p2);display:block;
  font-family:var(--disp);font-weight:800;font-size:11.5px;color:rgba(0,0,0,.6)}
.cell .l2{position:absolute;right:2px;bottom:1px;font-family:var(--disp);font-weight:900;font-size:9.5px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.day .d2{position:absolute;bottom:11px;right:4px;font-family:var(--disp);font-weight:900;font-size:11px;line-height:1}
.day .d2.p{opacity:.55}
.dblcard{display:flex;align-items:center;gap:12px}
.panel.dbl{border-left:4px solid var(--c2)}
.panel.dbl.ok{background:linear-gradient(160deg,#143324,var(--p1) 60%)}
.dblcard .L2{flex:0 0 auto;font-family:var(--disp);font-weight:900;font-size:46px;line-height:.9;width:40px;text-align:center}
.dblcard .tx{flex:1;min-width:0}
.dblcard .tx b{display:block;font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.1}
.dbladd{display:block;width:100%;margin:-4px 0 12px;padding:11px;border-radius:var(--r2);background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mut);font-weight:600;font-size:14.5px}
.cell .dn{position:absolute;top:1px;left:3px;font-family:var(--body);font-size:7px;font-weight:600;color:var(--dim)}
.cell.pre{background:transparent;box-shadow:inset 0 0 0 1px #1c2536}
.cell.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cell.miss{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(239,68,68,.7)}
.cell.rest{background:#1d2738;box-shadow:inset 0 0 0 1px #2e3a50}
.cell.done{color:rgba(0,0,0,.72)} .cell.done .dn{color:rgba(0,0,0,.45)}
.cell.guard{box-shadow:0 0 0 1.5px var(--vis),0 0 0 2.5px rgba(255,255,255,.7)}
.cell.today{outline:1.5px solid var(--txt);outline-offset:1px}
.cell.streak{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);margin-top:10px}
.legend.lets{margin-top:6px}
.legend.lets b{font-family:var(--disp);font-weight:900;font-size:14px;margin-right:2px}
.cell .lt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--disp);font-weight:900;font-size:15px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.cell .lt.dim{color:#8391a7;font-size:15px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ── SEMANA ── */
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wkhead .t{text-align:center}
.wkhead .t b{font-family:var(--disp);font-weight:800;font-size:22px;display:block;line-height:1.1}
.nbtn{width:44px;height:44px;border-radius:var(--r2);background:var(--p2);font-size:22px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{position:relative;padding:8px 2px 10px;border-radius:var(--r2);background:var(--p2);text-align:center;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.day .dw{font-size:11.5px;font-weight:700;color:var(--mut)}
.day .dd{font-size:12px;color:var(--dim)}
.day .L{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1;margin:4px 0 2px}
.day .bar{position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px}
.day.done{background:linear-gradient(160deg,color-mix(in srgb,var(--ec) 34%,var(--p2)),color-mix(in srgb,var(--ec) 12%,var(--p2)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ec) 60%,transparent)}
.day.done .dw,.day.done .dd{color:var(--txt)}
.day.done .ok{position:absolute;top:4px;right:5px;font-size:10px;font-weight:900;color:var(--ec)}
.day.done .bar{height:4px;box-shadow:0 0 8px var(--ec)}
.day.miss{opacity:.5}
.day.past:not(.done):not(.miss) .L{opacity:.55}
.day.sel{transform:translateY(-3px);box-shadow:inset 0 0 0 2px var(--silver)}
.day.sel:not(.done){background:var(--p3)}
.day.sel.done{box-shadow:inset 0 0 0 2px var(--silver),0 6px 16px -6px var(--ec)}
.day.today .dw{color:var(--vis)}
.day.guard::before{content:"";position:absolute;top:0;left:10%;right:10%;height:3px;background:linear-gradient(90deg,var(--vis),#fff,var(--vis));border-radius:0 0 3px 3px}
.c-f{color:var(--tf)} .c-r{color:var(--tr)} .c-m{color:var(--tm)} .c-o{color:var(--to)}

/* bloques de sesión */
.sec{margin:18px 0 6px}
.sec .st{font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.15;color:var(--silver)}
.sec .sd{font-size:13.5px;color:var(--mut);margin-top:2px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .main{flex:1;min-width:0}
.ex .nm{font-weight:600;font-size:15.5px}
.ex .sc{font-size:13.5px;color:var(--vis);font-weight:600}
.ex .hint{font-size:13px;color:var(--mut);margin-top:3px}
.ex .sets{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ex .ico{flex:0 0 auto;display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:var(--r2);background:var(--p2);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.ibtn.hot{background:linear-gradient(135deg,#f8b53a,var(--vis2));color:#1a1206}
.ibtn.clk{width:auto;min-width:40px;padding:0 8px;gap:3px;font-size:15px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--vis) 55%,transparent)}
.ibtn.clk small{font-size:12px;font-weight:700;color:var(--vis)}
.blk{border-left:3px solid var(--vis);padding-left:12px;margin-left:2px}
.blk-h{font-size:12.5px;color:var(--vis);font-weight:600;margin:4px 0 0}
.set{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:6px;background:var(--p2);font-size:13px;font-weight:600}
.set.pr{background:#3a2e05;color:var(--vis)}
.info{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14.5px;color:var(--silver);border-bottom:1px dashed var(--line)}
.info:last-child{border-bottom:0}
.info span:last-child{color:var(--mut);white-space:nowrap}
.note{font-size:14px;color:var(--mut);line-height:1.55;padding:12px 14px;border-radius:var(--r2);background:var(--p2);margin-top:12px}
.note b{color:var(--txt)}
.note.warn{box-shadow:inset 3px 0 0 var(--ember)}
.wod{padding:12px;border-radius:var(--r2);background:var(--p2);margin-top:8px}
.wod.pick{box-shadow:inset 0 0 0 2px var(--ok);background:#15301f}
.wod .wt{font-weight:600;font-size:15px}
.wod .wr{color:var(--ok);font-weight:700;font-size:14px;margin-top:4px}

/* barras de volumen */
.vbar{display:grid;grid-template-columns:minmax(78px,118px) minmax(60px,1fr) auto;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.vbar .tr{position:relative;height:14px;border-radius:3px;background:var(--p2);overflow:hidden}
.vbar .fl{position:absolute;inset:0 auto 0 0;border-radius:3px;transition:width .6s cubic-bezier(.3,.8,.3,1)}
.vbar .pl{position:absolute;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.55)}
.vbar .zn{position:absolute;top:0;bottom:0;background:rgba(52,209,122,.1);border-left:1px dashed rgba(52,209,122,.5);border-right:1px dashed rgba(52,209,122,.5)}
.vbar .n{text-align:right;font-weight:700}
/* ≥10 series: la barra entra en la pista y baila, en fase con las demás */
.vbar.hot .tr{overflow:visible}
.vbar.hot .fl{animation:vdance var(--per) cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--sync) - var(--i) * var(--per) / 7);
  box-shadow:0 0 calc(4px + var(--n) * 2px) var(--c);transform-origin:left center}
.vbar.hot .n{animation:vpop var(--per) cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--sync) - var(--i) * var(--per) / 7);color:var(--c)}
.vbar.hot>span:first-child::after{content:" ✦";color:var(--c);font-size:11px}
@keyframes vdance{0%,100%{transform:translateY(0) scaleY(1);filter:brightness(1)}
  25%{transform:translateY(calc(var(--amp) * -1px)) scaleY(calc(1 + var(--amp) * .06));filter:brightness(1.35)}
  50%{transform:translateY(0) scaleY(calc(1 - var(--amp) * .03))}
  75%{transform:translateY(calc(var(--amp) * .5px)) scaleY(calc(1 + var(--amp) * .03));filter:brightness(1.15)}}
@keyframes vpop{0%,100%{transform:translateY(0)}25%{transform:translateY(calc(var(--amp) * -.6px)) rotate(-4deg)}75%{transform:translateY(0) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.vbar.hot .fl,.vbar.hot .n{animation:none}}

/* pestañas internas */
.seg{display:flex;gap:4px;background:var(--p1);padding:4px;border-radius:var(--r2);margin-bottom:12px;position:sticky;top:0;z-index:5}
.seg button{flex:1;min-width:0;min-height:40px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.pick button{padding:8px 2px;border-radius:var(--r2);background:var(--p2);font-size:12.5px;font-weight:600;line-height:1.2;color:var(--mut)}
.pick button b{display:block;font-family:var(--disp);font-size:20px;font-weight:900;color:var(--txt)}
.pick button.on{background:var(--p3);box-shadow:inset 0 0 0 2px var(--vis);color:var(--txt)}
.pick.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick.goal button{font-size:clamp(10px,3vw,12.5px);padding:8px 0;letter-spacing:-.2px}
.pick.goal button b{font-size:clamp(16px,5vw,20px)}
.chk{display:flex;align-items:center;gap:10px}
.chk input{flex:1;min-width:0}
.inp{min-height:44px;padding:8px 12px;border-radius:var(--r2);background:var(--p2);border:1px solid var(--line);font-size:17px}
.verd{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.verd:last-child{border:0}
.verd .e{flex:0 0 auto;font-size:18px}
.dl{font-weight:700} .dl.up{color:var(--ok)} .dl.down{color:var(--bad)}
.techtog{margin-top:10px;width:100%;min-height:40px;border-radius:var(--r2);background:var(--p2);font-weight:600;font-size:14px;color:var(--ok);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ok) 45%,transparent)}
.techtog.off{color:var(--bad);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 60%,transparent);background:color-mix(in srgb,var(--bad) 12%,var(--p2))}
.reviewcard{border-left:4px solid var(--vis)}
.seg button.on{background:var(--p3);color:var(--txt)}

/* progreso */
.lift{display:grid;grid-template-columns:1fr 96px auto;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.lift:last-child{border-bottom:0}
.lift .v{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1;text-align:right}
.lift .v small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--mut);display:block;margin-top:2px}
.lift .d{font-size:13px;color:var(--mut)}
.up{color:var(--ok)} .down{color:var(--ember2)}
.field{margin-bottom:10px}
.field label{display:block;font-size:13.5px;color:var(--mut);margin-bottom:4px;font-weight:500}
.field input{width:100%;min-height:48px;padding:10px 12px;border-radius:var(--r2);background:var(--p2);border:1px solid var(--line);font-size:17px}
.field input:focus{outline:none;border-color:var(--vis)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trophies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tro{padding:12px 6px;border-radius:var(--r2);background:var(--p2);text-align:center}
.tro .e{font-size:28px;line-height:1}
.tro .n{font-weight:700;font-size:13px;margin-top:6px;line-height:1.2}
.tro .d{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.3}
.tro.lock{opacity:.45;filter:grayscale(1)}
.tro.new{animation:glow 2s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--vis),0 0 22px rgba(246,167,35,.5)}}
details.fold{background:var(--p1);border-radius:var(--r2);margin-bottom:10px}
details.fold>summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-family:var(--disp);font-size:24px;color:var(--mut);line-height:1}
details.fold[open]>summary::after{content:"−"}
details.fold>div{padding:0 16px 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}

/* ── Navegación ── */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(16,21,31,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--dim)}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:var(--vis)}

/* ── Hojas y superposiciones ── */
.ov{position:fixed;inset:0;z-index:50;display:none}
#sheetOv{z-index:70}
.ov.show{display:block}
.scrim{position:absolute;inset:0;background:rgba(5,8,14,.7);animation:fadein .2s both}
@keyframes fadein{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--p1);border-radius:22px 22px 0 0;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.3,1) both;max-width:640px;margin:0 auto}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(100%)}}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 12px;border-radius:var(--r2);background:var(--p2);margin-bottom:8px;font-size:15.5px;font-weight:600}
.opt small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.opt .L{font-family:var(--disp);font-weight:900;font-size:26px;width:30px;text-align:center}
.opt.on{box-shadow:inset 0 0 0 2px var(--vis)}
.grp{font-size:13px;color:var(--mut);font-weight:700;margin:14px 0 6px}
.chip.x .lbl{font:inherit;color:inherit;padding:0;background:none}

/* ── MODO SESIÓN ── */
#sess{background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(20px + env(safe-area-inset-bottom,0px))}
.s-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.s-top .t{flex:1;min-width:0}
.s-top .t b{display:block;font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-top .t span{font-size:13px;color:var(--mut)}
.dots{display:flex;gap:4px;margin-bottom:14px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--p2);transition:background .3s}
.dots i.half{background:#6e5a0a} .dots i.full{background:var(--vis)} .dots i.cur{box-shadow:0 0 0 1.5px var(--txt)}
.s-card{background:var(--p1);border-radius:6px 22px 6px 22px;padding:18px 16px}
.s-card .ssb{display:inline-block;font-size:12.5px;font-weight:700;color:#141414;background:var(--vis);border-radius:4px;padding:2px 8px;margin-bottom:8px}
.s-card h1{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.02}
.s-card .sc{color:var(--vis);font-weight:600;font-size:16px;margin-top:4px}
.target{display:flex;gap:10px;align-items:stretch;margin-top:14px}
.target>div{flex:1;background:var(--p2);border-radius:var(--r2);padding:10px 12px}
.target .k{font-size:12.5px;color:var(--mut)}
.target .v{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1.1}
.target .v.tg{color:var(--vis)}
.why{font-size:13.5px;color:var(--mut);margin-top:8px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.steppers.one{grid-template-columns:1fr}
.stp{background:var(--p2);border-radius:var(--r2);padding:8px}
.stp .k{font-size:12.5px;color:var(--mut);text-align:center}
.stp .ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stp button{height:48px;border-radius:8px;background:var(--p3);font-size:26px;font-weight:700;min-width:0}
.stp input{grid-column:1/-1;order:-1;min-width:0;width:100%;text-align:center;background:transparent;border:0;font-family:var(--disp);font-weight:900;font-size:clamp(32px,10vw,46px);line-height:1.1;padding:2px 0 4px}
.steppers.one .stp .ctl{grid-template-columns:64px 1fr 64px}
.steppers.one .stp input{grid-column:2;order:0}
.stp input:focus{outline:none;color:var(--vis)}
.rir{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.rir button{padding:10px 4px;border-radius:var(--r2);background:var(--p2);font-size:13.5px;font-weight:600;color:var(--mut);line-height:1.2}
.rir button b{display:block;font-family:var(--disp);font-size:20px;color:var(--txt)}
.rir button.on{box-shadow:inset 0 0 0 2px var(--vis);color:var(--txt)}
.logbtn{margin-top:14px;min-height:62px;font-size:19px;font-family:var(--disp);font-weight:800;letter-spacing:.02em}
.restbox{margin-top:14px;display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r2);background:var(--p2)}
.restbox svg{flex:0 0 auto;width:46px;height:46px}
.restbox>div{min-width:0}
.restbox .rbtns{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.restbox .rbtns .chip{justify-content:center;min-width:64px}
.restbox .rt{font-family:var(--disp);font-weight:900;font-size:clamp(28px,9vw,40px);line-height:1}
.restbox .rl{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.s-nav{display:flex;gap:8px;margin-top:12px}
.qnav{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;margin:12px -6px 0;padding:6px;border-radius:14px;
  background:rgba(23,32,49,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 14px -8px rgba(0,0,0,.7)}
.qnav button{flex:0 0 auto;width:58px;height:48px;border-radius:11px;background:var(--p3);font-size:30px;font-weight:700;line-height:1;color:var(--txt)}
.qnav button:not([disabled]):last-child{background:linear-gradient(135deg,#f8b53a,var(--vis2));color:#1a1206}
.qnav button[disabled]{opacity:.3}
.qnav .qm{flex:1;min-width:0;text-align:center;line-height:1.15}
.qnav .qm b{display:block;font-family:var(--disp);font-weight:900;font-size:18px}
.qnav .qm span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-nav .btn{flex:1}
.s-list{margin-top:16px}
.s-list .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r2);margin-bottom:6px;background:var(--p1);width:100%;text-align:left}
.s-list .it.cur{box-shadow:inset 0 0 0 2px var(--vis)}
.s-list .it .c{font-family:var(--disp);font-weight:800;font-size:18px;min-width:34px;text-align:center;color:var(--mut)}
.s-list .it.ok .c{color:var(--ok)}
.s-list .hd{font-size:13px;font-weight:700;color:var(--silver);margin:12px 2px 6px}

/* ── Temporizador ── */
#tm{background:#05070b;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#tm.show{display:flex}
#tm .tt{font-size:14px;color:var(--mut);text-align:center;max-width:88vw}
#tm .ph{font-family:var(--disp);font-weight:900;font-size:clamp(26px,7vmin,44px);margin-top:6px;color:var(--vis);text-align:center}
.ring{position:relative;width:min(80vw,56vh);aspect-ratio:1;margin:2vh 0}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;
  font-size:min(24vw,17vh);font-variant-numeric:tabular-nums;color:var(--vis);line-height:1}
#tm .sub{font-size:16px;color:var(--mut);min-height:1.4em;text-align:center}
#tm .menu{width:100%;max-width:380px;max-height:60vh;overflow-y:auto}
#tm .ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px;margin-top:2vh}
#tm .ctl .btn:first-child{grid-column:1/-1;min-height:60px;font-size:19px}
#tm .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:44px;height:44px;border-radius:50%;background:var(--p2);font-size:18px}
#tmini{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;display:none;align-items:center;gap:10px;
  padding:8px 10px 8px 16px;border-radius:999px;background:var(--p2);box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 0 0 2px var(--vis)}
#tmini.show{display:flex}
#tmini b{font-family:var(--disp);font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
@media (orientation:landscape) and (max-height:520px){
  #tm{flex-direction:row;flex-wrap:wrap;gap:0 24px}
  .ring{width:70vh}
  #tm .ctl{max-width:300px}
}

/* ── Celebración ── */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
#win{position:fixed;inset:0;z-index:79;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#win.show{display:flex}
#win .w1{font-family:var(--disp);font-weight:900;font-size:clamp(56px,17vw,110px);line-height:.9;color:var(--txt);text-align:center;
  animation:slam .55s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 8px 30px rgba(0,0,0,.6)}
#win .w2{margin-top:14px;font-size:17px;color:var(--silver);animation:fade .4s .35s both;text-align:center;max-width:80vw}
#win .tape{width:120vw;height:34px;transform:rotate(-6deg);margin:-6px 0 0;animation:sweep .5s .1s cubic-bezier(.6,0,.2,1) both}
#win .tape::after{animation:shine 1.1s .45s both}
@keyframes slam{from{transform:scale(2.4);opacity:0}60%{opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:none;
  max-width:min(92vw,520px);padding:12px 16px;border-radius:var(--r2);background:var(--p3);color:var(--txt);font-weight:600;font-size:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center}
#toast.show{display:block;animation:toastin .3s cubic-bezier(.2,1.3,.4,1) both}
#toast.gold{background:linear-gradient(135deg,#4a3a06,#2a2105);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1.5px var(--vis)}
@keyframes toastin{from{transform:translate(-50%,20px);opacity:0}}
.empty{text-align:center;padding:22px 10px;color:var(--mut);font-size:15px}
.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:4px}
svg.chart{width:100%;display:block}
.hidden{display:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ══ ANIMACIÓN · menú de videojuego ══ */
.st{animation:stIn .34s cubic-bezier(.2,.9,.25,1.12) both;animation-delay:var(--d,0ms)}
@keyframes stIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
main.enter{animation-duration:.2s}
.board .v.tick,.v.tick{animation:tick .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes tick{40%{transform:scale(1.14)}}
.cmap.wave .cell{animation:cellIn .38s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--w) * 22ms + 120ms)}
@keyframes cellIn{from{opacity:0;transform:scale(.3) rotate(-12deg)}}
.vbar.grow .tr{animation:sweep .55s cubic-bezier(.6,0,.2,1) both;animation-delay:calc(var(--g) + 150ms)}
.days .day.drop{animation:drop .36s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--g)}
@keyframes drop{from{opacity:0;transform:translateY(-22px) scale(.85)}}
#tabInd{position:absolute;left:0;top:0;width:25%;height:3px;pointer-events:none;transition:transform .32s cubic-bezier(.2,1.3,.35,1)}
#tabInd::before{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#f8b53a,var(--vis2));box-shadow:0 0 12px var(--vis)}
nav.tabs button.pop svg{animation:tabPop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes tabPop{30%{transform:translateY(-5px) scale(1.25) rotate(-6deg)}60%{transform:translateY(0) scale(.95)}}
nav.tabs button{transition:color .2s}
/* respuesta al dedo: hundirse y un destello que cruza */
.btn,.opt,.ibtn,.chip,.day,.pick button,.sema button,.seg button,.rir button,.panel[data-act]{position:relative;overflow:hidden;transition:transform .09s ease-out,filter .2s,background .2s}
.opt:active,.ibtn:active,.chip:active,.pick button:active,.sema button:active,.seg button:active,.rir button:active,.panel[data-act]:active{transform:scale(.96)}
.day:active{transform:translateY(-3px) scale(.94)}
.zap::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);animation:zap .42s ease-out both}
@keyframes zap{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
.cell.zap::after{background:rgba(255,255,255,.25);animation:fadeout .35s both}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
/* hojas que suben con muelle */
@keyframes up{0%{transform:translateY(100%)}70%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.sheet .opt,.sheet .lrow,.sheet .field,.sheet .pick,.sheet .btn{animation:stIn .3s cubic-bezier(.2,.9,.25,1.1) both}
.sheet>*:nth-child(2){animation-delay:30ms}.sheet>*:nth-child(3){animation-delay:60ms}.sheet>*:nth-child(4){animation-delay:90ms}.sheet>*:nth-child(5){animation-delay:120ms}.sheet>*:nth-child(n+6){animation-delay:150ms}
/* modo sesión: el botón grande respira cuando toca */
.logbtn{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 26px -4px rgba(255,127,58,.65)}}
#sess.show{animation:sessIn .3s cubic-bezier(.2,.9,.25,1.05) both}
@keyframes sessIn{from{opacity:0;transform:translateY(30px) scale(.98)}}
@media (prefers-reduced-motion:reduce){.st,.cmap.wave .cell,.vbar.grow .tr,.days .day.drop,.logbtn,.zap::after{animation:none!important}}

/* Migración desde v46 (clave "cabra2"). La copia antigua NO se toca: si algo va mal, sigue ahí. */
function migrate(o) {
  const copy = ["startDate", "done", "energy", "swap", "exswap", "exadd", "wodRoll", "wodAlt", "expair", "exRoll", "mat", "free", "guardOv", "diary", "badges"];
  copy.forEach(k => { if (o[k] != null) S[k] = JSON.parse(JSON.stringify(o[k])); });
  if (o.age) S.age = +o.age; if (o.h) S.h = +o.h;
  if (o.wodDone) Object.keys(o.wodDone).forEach(k => { const w = o.wodDone[k]; if (w && typeof w === "object") S.wodDone[k] = { i: w.i, r: w.r || "" }; });
  S.body = (o.logs || []).filter(l => l && l.d).map(l => {
    const b = { d: l.d }; const w = +l.w, f = +l.fat;
    if (w >= 30 && w <= 250) b.w = w; if (f >= 3 && f <= 60) { b.fat = f; b.met = l.met || ""; }
    ["c", "n", "pc", "ab", "mu"].forEach(k => { if (+l[k] > 0) b[k] = +l[k]; });
    return b;
  }).filter(b => b.w || b.fat).sort((a, b) => a.d < b.d ? -1 : 1);
  // historial de series: por nombre → por identidad
  const src = {};
  const addRec = (name, r) => { if (r && r.d) { (src[name] = src[name] || []).push(r); } };
  Object.keys(o.whist || {}).forEach(n => (o.whist[n] || []).forEach(r => addRec(n, r)));
  ["wlog", "wprev"].forEach(k => Object.keys(o[k] || {}).forEach(n => { const r = o[k][n]; if (r && r.d && !(src[n] || []).some(x => x.d === r.d)) addRec(n, r); }));
  let nSets = 0;
  Object.keys(src).forEach(name => {
    const info = exInfo(name.split(" + ")[0], "");
    src[name].forEach(r => {
      let sets = r.sets || (r.kg != null ? [(r.bw || r.timed) ? [r.kg] : [r.kg, r.reps]] : []);
      const k = info.k;
      sets = sets.map(s => {
        if (k === "w") return [+s[0] || 0, +s[1] || 0, s[2] == null ? 1 : +s[2]];
        if (k === "s") return [+s[0] || 0];
        return [+s[0] || 0, s[1] == null ? 1 : +s[1]];
      }).filter(s => s[0] > 0 && (k !== "w" || s[1] > 0));
      if (!sets.length) return;
      nSets += sets.length;
      const h = S.hist[info.id] = S.hist[info.id] || [];
      const ex = h.find(x => x.d === r.d);
      if (ex) ex.sets = ex.sets.concat(sets); else h.push({ d: r.d, n: name, k, sets });
    });
  });
  Object.values(S.hist).forEach(h => h.sort((a, b) => a.d < b.d ? -1 : 1));
  Object.keys(o.rm1 || {}).forEach(n => { const v = +o.rm1[n]; if (v > 0) S.rm[exInfo(n, "").id] = v; });
  if (o.marks) { const map = { sq: "squat", bp: "bench", dl: "deadlift" }; Object.keys(map).forEach(k => { if (+o.marks[k] > 0 && !S.rm[map[k]]) S.rm[map[k]] = +o.marks[k]; }); }
  const le = localStorage.getItem("cabraLastExport"); if (le) S.lastExport = le;
  Object.keys(S.hist).forEach(id => { S.hist[id].sort((a, b) => a.d < b.d ? -1 : 1); S.hist[id].forEach(r => { const b = recBest(r), bb = bestBefore(id, r.d); if (b && bb > -Infinity && b.v > bb) r.pr = true; }); });
  S.migrated = { d: today(), days: Object.keys(S.done).length, sets: nSets, body: S.body.length };
}

  const raw = Math.floor(daysBetween(S.startDate, k) / 7) + 1;
  if (raw < 1) return { w: 1, cycle: 1, pre: true, raw };
  return { w: ((raw - 1) % 52) + 1, cycle: Math.floor((raw - 1) / 52) + 1, pre: false, raw };
}

    if (key === "B" && (ph === 2 || ph === 4) && !par && /^Press banca$/.test(r[0])) { v = "<b>Press inclinado con mancuernas</b>: pecho alto y hombro, el volumen que más se nota con camiseta."; return ["Press inclinado con mancuernas (banco ~30°)", "4×6-8 · RPE 8", 150]; }

function adaptEx(T, mode) {
  let ex = T.ex.slice();

    if (mode === "reduced") return { ex, banner: "A medias: dos tercios de la sesión — quita 1-2 series del bloque central o recorta 10' del rodaje. Suave pero hecho." };
    if (mode === "minimal") return { ex: ex.slice(0, 1), banner: "Lo justito: 10-15' suaves y a casa. La constancia es la victoria." };
    return { ex, banner: "" };
  }
  if (mode === "full") return { ex, banner: "" };
  const cut = ex.findIndex(e => /^💥|^💗/.test(e[0])); if (cut >= 0) ex = ex.slice(0, cut);
  if (mode === "reduced") return { ex: ex.slice(0, -1), banner: "A medias: un accesorio menos y sin finisher. Hecha vale más que perfecta." };

}
function phaseTune(key, ex, mode, w) {
  if (!["A", "B", "G"].includes(key)) return { ex, pnote: "" };
  const ph = phaseOf(w), sch = SCHEMES_EL[ph.id] || SCHEMES_EL[1], dl = isDeload(w);
  let out = ex.map(e => {
    if (!(e[2] >= 120)) {
      if (ph.id === 3 && e[2] > 0 && e[2] < 120 && !/nórdico|rodillo|plancha/i.test(e[0]) && /^3×/.test(e[1])) return [e[0], e[1].replace(/^3×/, "2×"), e[2]];
      return e;
    }
    const scheme = /hip thrust/i.test(e[0]) ? sch.ht : sch.sets;
    return [e[0], dl ? "2×5 · 60% del peso (descarga)" : scheme, dl ? 90 : sch.rest];
  });
  if (ph.id === 3 && !dl && mode === "full") {
    const wi = out.findIndex(e => /🅰️/.test(e[0]));
    if (wi >= 0) out = [...out.slice(0, wi), ["⚡ POTENCIA — en frescura total, antes del pesado. Velocidad máxima; si pierde chispa, se acaba la serie.", "—"],
      [key === "G" ? "Swing pesado (kettlebell 24 kg)" : "Salto al cajón o swing pesado 24 kg", "4×5 · explosivo", 90], ...out.slice(wi)];
  }

    : `<b>Semana ${w} · ${ph.name.split("·")[1].trim().toLowerCase()}.</b> Bloque pesado a ${sch.sets} — ${sch.tag}.`;
  return { ex: out, pnote };
}

  else if (dW != null && dW < -0.3 && down >= 2) V.push(["🔋", "Bajas peso y los básicos caen: el déficit es demasiado agresivo o duermes poco. Sube 150-200 kcal y prioriza proteína."]);
  if (down >= 2 && (out.rpeAvg || 0) >= 8) V.push(["😮‍💨", "Básicos a la baja con esfuerzo percibido alto: fatiga acumulada. Adelanta la descarga una semana; no es rendirse, es cobrar."]);
  else if (up >= 2) V.push(["📈", up + " marcas mejoran respecto al mes anterior. La progresión funciona: no toques lo que funciona."]);

   Hall 2008 lo matiza, pero sirve de volante). Si además anotas kcal, se estima tu gasto real

function spark(pts, col, W = 96, H = 34) {

  const xy = pts.map((p, i) => [(i / (pts.length - 1)) * (W - 6) + 3, H - 4 - ((p.v - mn) / r) * (H - 8)]);

    inputSheet("Resultado: " + o.f, o.res + ". Opcional, pero es tu marca a batir cuando vuelva a salir.", "", v => { S.wodDone[k] = { i: +d.i, r: v }; save(); if (SS) renderSess(); render({ keepScroll: true }); toast(v ? "WOD registrado: " + v : "WOD hecho"); }); },
  wodTimer: d => { tmOpenMenu(d.dk, +d.i, d.k); },
  wodRoll: d => { const k = d.dk + dayOf(d.dk, d.k).key; S.wodRoll[k] = (S.wodRoll[k] || 0) + 1; save(); if (SS) renderSess(); render({ keepScroll: true }); toast("Tres WODs nuevos. El azar también entrena."); },
  wodExtra: d => { const key = dayOf(d.dk, d.k).key, p = suggestExtraPair(key, d.dk); if (!p.length) { toast("No encuentro extras para hoy"); return; } S.wodAlt[akOf(d)] = "extra"; S.expair[akOf(d)] = p; save(); if (SS) renderSess(); render({ keepScroll: true }); toast("Extra para los músculos que van por detrás"); },
  wodBack: d => { delete S.wodAlt[akOf(d)]; save(); render({ keepScroll: true }); },
  extraRoll: d => { const key = dayOf(d.dk, d.k).key; S.exRoll[d.dk + key] = (S.exRoll[d.dk + key] || 0) + 1; S.expair[akOf(d)] = suggestExtraPair(key, d.dk); save(); render({ keepScroll: true }); },
  ptab: d => { progTab = d.t; render(); },
  liftSheet: d => liftSheet(d.id),
  setRm: d => inputSheet("1RM medido", "Kilos levantados en una sola repetición. Vacío para borrar. El dato medido manda sobre el estimado.", S.rm[d.id] || "", v => { const n = parseFloat(String(v).replace(",", ".")); if (n > 0) S.rm[d.id] = n; else delete S.rm[d.id]; save(); closeSheet(); render({ keepScroll: true }); }, { num: true }),
  saveBody: () => {
    const g = id => { const el = $(id); if (!el) return null; const n = parseFloat(String(el.value).replace(",", ".")); return n > 0 ? n : null; };
    const ah = ($("b_ah").value || "").split(/[·\s/]+/).map(x => parseFloat(x)).filter(x => x > 0); if (ah[0] > 10 && ah[0] < 100) S.age = ah[0]; if (ah[1] > 120 && ah[1] < 230) S.h = ah[1];
    const L = { d: today(), w: g("b_w"), c: g("b_c"), n: g("b_n"), pc: g("b_pc"), ab: g("b_ab"), mu: g("b_mu") };
    if (L.w && !(L.w >= 30 && L.w <= 250)) { toast("Peso fuera de rango: revisa el dato"); return; }
    const bf = bodyFat(L); if (bf.fat != null) { L.fat = Math.max(4, Math.min(45, bf.fat)); L.met = bf.met; }
    if (!L.w && L.fat == null) { toast(bf.miss ? "No puedo calcular la grasa: " + bf.miss : "Pon al menos el peso"); return; }
    Object.keys(L).forEach(k => L[k] == null && delete L[k]);
    const i = S.body.findIndex(b => b.d === L.d); if (i >= 0) S.body[i] = Object.assign({}, S.body[i], L); else S.body.push(L);
    S.body.sort((a, b) => a.d < b.d ? -1 : 1); save(); render({ keepScroll: true });
    toast("Guardado" + (L.w ? ": " + fmtNum(L.w) + " kg" : "") + (L.fat ? " · " + fmtNum(L.fat) + "% (" + L.met + ")" : "") + (bf.miss && L.fat == null ? " · grasa sin calcular: " + bf.miss : ""));
  },
  delBody: d => { S.body = S.body.filter(b => b.d !== d.d); save(); render({ keepScroll: true }); },
  export: () => doExport(),
  import: () => { const f = $("impFile"); f.onchange = e => { if (e.target.files[0]) doImport(e.target.files[0]); }; f.click(); },
  closeSheet: () => closeSheet(),
  sheetOk: () => { const v = ($("shIn") || {}).value; const cb = sheetCb; closeSheet(); if (cb) cb((v || "").trim()); },
  // sesión
  sessOpen: d => sessOpen(d.dk, null, d.k || null),
  sessClose: () => sessClose(),
  sessList: () => { SS.list = !SS.list; renderSess(); },
  sGo: d => { SS.i = +d.i; SS.list = false; renderSess(); },
  sNav: d => { const a = document.activeElement; if (a && a.matches && a.matches("input[data-f]")) { const n = parseFloat(String(a.value).replace(",", ".")); const it = exItems(SS.day)[SS.i]; if (it && isFinite(n) && n > 0) inpFor(it)[a.dataset.f] = n; a.blur(); }
    SS.i = Math.max(0, Math.min(exItems(SS.day).length, SS.i + +d.d)); renderSess(); $("sess").scrollTo({ top: 0, behavior: "smooth" }); },
  stp: d => stpChange(d.f, +d.s),
  rir: (d, el) => { const it = exItems(SS.day)[SS.i]; inpFor(it).rir = +d.c; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); },
  logSet: () => logSet(),
  sDel: d => { const it = exItems(SS.day)[SS.i]; delSet(it.id, SS.dk, +d.i); renderSess(); },
  finPick: (d, el) => { const was = el.classList.contains("on"); el.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("on")); if (!was) el.classList.add("on"); },
  techTog: () => { const it = exItems(SS.day)[SS.i]; const v = inpFor(it); v.tech = v.tech === 0 ? 1 : 0; renderSess(); },
  painAM: d => { S.painAM[today()] = +d.v; save(); render({ keepScroll: true }); toast(["Bien: la zona se adapta. Adelante.", "Igual que ayer: aceptable. Sigue el plan y escucha.", "Peor: hoy toca modo a medias. La zona manda."][+d.v]); },
  openReview: () => { progTab = "revision"; view = "progreso"; render(); },
  reviewOk: d => { S.reviews[d.k] = today(); save(); render({ keepScroll: true }); toast("Revisión archivada. Nos vemos en cuatro semanas."); },
  quickW: () => { const n = parseFloat(String($("qW").value).replace(",", ".")); if (!(n >= 30 && n <= 250)) { toast("Peso fuera de rango: revisa el dato"); return; } const i = S.body.findIndex(b => b.d === today()); if (i >= 0) S.body[i].w = n; else { S.body.push({ d: today(), w: n }); S.body.sort((a, b) => a.d < b.d ? -1 : 1); } save(); render({ keepScroll: true }); toast("Anotado: " + fmtNum(n) + " kg. La báscula opina; la tendencia decide."); },
  setZone: () => { S.zone = ($("zoneIn").value || "").trim(); save(); toast(S.zone ? "Vigilando: " + S.zone : "Sin zona definida"); },
  goal: d => { S.goal = { rate: +d.r }; save(); render({ keepScroll: true }); },
  protTog: () => { const t = today(); S.food[t] = Object.assign({}, S.food[t], { p: S.food[t] && S.food[t].p ? 0 : 1 }); save(); render({ keepScroll: true }); },
  foodSave: () => { const n = parseInt($("fK").value, 10), t = today(); S.food[t] = Object.assign({}, S.food[t]); if (n > 300 && n < 8000) S.food[t].kcal = n; else delete S.food[t].kcal; save(); render({ keepScroll: true }); toast(n > 300 ? "Kcal guardadas" : "Kcal borradas"); },
  restGo: d => { tmRest(+d.s || 60); if (!SS) { $("tmini").classList.add("show"); } paintRest(); tmPaint(); },
  restAdd: () => { if (TM.cfg) { TM.cfg.a[0] += .5; if (!TM.run) tmRun(); paintRest(); } },
  restSkip: () => tmStop(),
  // temporizador
  tmMenu: d => tmOpenMenu(d.dk),
  tmPick: d => tmPick(+d.i),
  tmToggle: () => { if (!TM.cfg) return; if (TM.run) { TM.run = false; clearInterval(TM.int); } else { const st = tmState(); if (/¡|Cap/.test(st.ph + st.sub)) { TM.el = 0; TM.sig = ""; TM.t3 = -1; } tmRun(); beep(660, 90); } tmPaint(); },
  tmReset: () => { TM.run = false; clearInterval(TM.int); TM.el = 0; TM.sig = ""; TM.t3 = -1; tmPaint(); },
  tmMin: () => { $("tm").classList.remove("show"); $("tmini").classList.add("show"); tmPaint(); },
  tmShow: () => { if (TM.rest && SS) { $("tmini").classList.remove("show"); return; } $("tmini").classList.remove("show"); $("tm").classList.add("show"); if (TM.cfg) tmFrame(TM.rest ? "Entre series" : TM.label); else if (!$("tmBig")) tmPick(0); tmPaint(); },
  tmBack: () => { TM.run = false; clearInterval(TM.int); tmOpenMenu(TM.dk); },
  tmClose: () => { TM.run = false; clearInterval(TM.int); TM.cfg = null; $("tm").classList.remove("show"); $("tmini").classList.remove("show"); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault(); e.stopPropagation();
  try { f(el.dataset, el, e); } catch (err) { console.error(err); toast("Algo ha fallado: " + err.message); }
});
document.addEventListener("pointerdown", () => { if (!WL) lockScreen(); if (AC && AC.state === "suspended") AC.resume(); }, { passive: true });
$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (!b) return; view = b.dataset.view; if (view === "semana") { weekOff = 0; selDay = null; } render(); });
$("sess").addEventListener("change", e => { const inp = e.target.closest("input[data-f]"); if (!inp || !SS) return; const it = exItems(SS.day)[SS.i]; const n = parseFloat(String(inp.value).replace(",", ".")); if (isFinite(n) && n > 0) inpFor(it)[inp.dataset.f] = n; });
$("sess").addEventListener("focusin", e => { if (e.target.matches("input[data-f]")) e.target.select(); });
// deslizar entre pestañas
let swX = null, swY = 0, swT = 0;
document.addEventListener("touchstart", e => { if (SS || $("tm").classList.contains("show") || $("sheetOv").classList.contains("show") || e.target.closest("input,.days,.seg,svg")) { swX = null; return; } swX = e.touches[0].clientX; swY = e.touches[0].clientY; swT = Date.now(); }, { passive: true });
document.addEventListener("touchend", e => { if (swX == null) return; const dx = e.changedTouches[0].clientX - swX, dy = e.changedTouches[0].clientY - swY; if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2.2 && Date.now() - swT < 600) { const j = VIEWS.indexOf(view) + (dx < 0 ? 1 : -1); if (j >= 0 && j < VIEWS.length) { view = VIEWS[j]; render(); } } swX = null; }, { passive: true });
// en la vista Semana, deslizar sobre la tira de días cambia de semana
document.addEventListener("touchstart", e => { const d = e.target.closest(".days"); if (!d) return; d._x = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { const d = e.target.closest(".days"); if (!d || d._x == null) return; const dx = e.changedTouches[0].clientX - d._x; d._x = null; if (Math.abs(dx) > 60) ACT.week({ d: dx < 0 ? 1 : -1 }); }, { passive: true });

/* ══════════════ ARRANQUE ══════════════ */
function boot() {
  const st = load();
  fxInit();
  render();
  if (st === "migrated") setTimeout(() => toast("Datos de v46 importados: " + S.migrated.sets + " series, " + S.migrated.days + " días. La copia vieja sigue intacta."), 900);
  setInterval(() => { if (!document.hidden && !WL) lockScreen(); }, 15000);
  let lastDay = today(); setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!SS) render({ keepScroll: true }); } }, 60000);
}
boot();

</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
